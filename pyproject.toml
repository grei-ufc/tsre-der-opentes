[project]
name = "tsre-der-opentes"
version = "0.1.0"
description = "Rede elétrica (OpenDSS) da co-simulação OpenTES: adaptador Mosaik, coletor e caso IEEE 13 do mercado."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "mosaik==3.5.0",
    "mosaik-api==3.0.6",
    "pandas>=2.3.2",
    "py-dss-interface>=2.3.0",
    "setuptools==69.5.1",
]

[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools]
package-dir = { "" = "src" }
