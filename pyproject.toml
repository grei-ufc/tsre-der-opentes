[project]
name = "tsre-der-opentes"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "ipykernel>=6.31.0",
    "mosaik==3.5.0",
    "mosaik-pandapower==0.2.2",
    "opender==2.1.6",
    "pandas>=2.3.2",
    "py-dss-interface>=2.0.0",
    "setuptools==69.5.1",
    "simbench>=1.5.3",
    "websockets>=15.0",
]

[project.scripts]
# Define os comandos de console. A chave ('tsre') é o comando.
# O valor aponta para 'nome_do_pacote.nome_do_modulo:nome_da_funcao'.
# Ex: 'my_package.main:run' -> src/my_package/main.py (e a função run lá dentro).
# Lembre-se de sincronizar o nome do pacote com 'known-first-party' do Ruff.
tsre = "main:main"

# ============================
# Build e Setuptools
# ============================
[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
# Informa ao setuptools para encontrar os pacotes dentro da pasta 'src'.
# Essencial para a estrutura de layout com 'src/'.
where = ["src"]

[tool.setuptools]
# Mapeia o diretório raiz de pacotes para 'src'.
package-dir = { "" = "src" }

[tool.setuptools.package-data]
# Os estáticos da visualização web (HTML/CSS/JS) não são módulos Python; sem
# isso eles ficariam de fora de um wheel e o servidor subiria sem página.
"simulators.webvis" = ["server/html/*.html", "server/html/media/*"]

# ============================
# Ruff (linter + formatter)
# ============================
[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "scenarios"]
extend-exclude = ["src/simulators/old"]

[tool.ruff.lint]
select = [
    "F",     # Pyflakes
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "I",     # isort (import sorting)
    "UP",    # pyupgrade
    "B",     # flake8-bugbear
    "SIM",   # flake8-simplify
    "RUF",   # ruff-specific rules
]
ignore = [
    "E501",   # line too long (handled by formatter)
    "B008",   # function call in default argument (mosaik pattern)
    "SIM108", # ternary operator (readability tradeoff)
]

[tool.ruff.lint.per-file-ignores]
"scenarios/*" = ["F841", "B006"]  # scenario scripts, allow unused vars
# `actual == pytest.approx(expected)` e a ordem documentada pelo pytest; o
# SIM300 a confunde com uma condicao Yoda.
"tests/*" = ["SIM300"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true

[dependency-groups]
dev = [
    "pytest>=8.4.2",
    "ruff>=0.16.3",
]
docs = [
    "mkdocs>=1.6.1",
    "mkdocs-material>=9.7.7",
    "mkdocs-git-revision-date-localized-plugin>=1.3.0",
    "mkdocstrings[python]>=0.27.0",
]
